<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пекарня V5 - DEBUG</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html,
        body{
            width:100%;
            height:100%;
            overflow:hidden;
            background:#0f0904;
            font-family:Arial,sans-serif;
            position: relative;
        }

        body{
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #debug-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            padding: 10px;
            border: 1px solid #0f0;
            font-size: 12px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            z-index: 10000;
        }

        canvas{
            display:block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        /* Мобильные устройства */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            
            canvas {
                width: 100vw !important;
                height: 100vh !important;
            }

            #debug-container {
                top: 10px;
                right: 10px;
                max-width: 150px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div id="debug-container"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<script>
// Простая система логирования
const debugContainer = document.getElementById('debug-container');
const logs = [];

function addDebugLog(msg) {
    const time = new Date().toLocaleTimeString();
    logs.push(`[${time}] ${msg}`);
    if (logs.length > 50) logs.shift();
    debugContainer.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
    console.log(msg);
}

window.onerror = function(msg, url, line, col, error) {
    addDebugLog(`❌ ERROR: ${msg}`);
    addDebugLog(`📍 ${url}:${line}`);
    if (error) addDebugLog(`Stack: ${error.stack.substring(0, 100)}`);
    return true;
};

addDebugLog('🚀 Инициализация...');
</script>

<script type="module">
    import { GameScene } from "./src/scenes/GameScene.js";

    const addDebugLog = window.addDebugLog;

    addDebugLog('📦 Загрузка модулей...');

    const config = {
        type: Phaser.AUTO,
        backgroundColor: "#0f0904",
        width: window.innerWidth,
        height: window.innerHeight,
        scale: {
            mode: Phaser.Scale.RESIZE,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            fullscreenTarget: 'body'
        },
        render: {
            pixelArt: false,
            antialias: true
        },
        scene: [GameScene],
        physics: {
            default: 'arcade',
            arcade: {
                debug: false
            }
        }
    };

    addDebugLog('🎮 Создание Phaser.Game...');
    
    try {
        const game = new Phaser.Game(config);
        addDebugLog('✅ Phaser инициализирован');
    } catch (e) {
        addDebugLog(`❌ Ошибка Phaser: ${e.message}`);
        addDebugLog(`Stack: ${e.stack.substring(0, 200)}`);
    }
</script>

</body>
</html>
